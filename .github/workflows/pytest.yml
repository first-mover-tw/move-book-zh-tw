# zh-TW 專屬 gate，不是上游檔案 —— 與 prettier.yml 同理刻意獨立成一個檔，
# 不塞進 test.yml（那是 MystenLabs/move-book 的複製品，改它每次 upstream sync
# 都要處理衝突）。
#
# 為什麼需要這道 gate：整個翻譯管線的守衛都寫在 pytest 裡，但**沒有任何
# workflow 跑過它**（2026-09-05 實測 `grep -rn pytest .github/workflows/` 零結果）。
# 於是專門為某個缺陷加的守衛等於不存在 —— 最直接的例子是
# `test_every_sidebar_doc_id_resolves_to_an_existing_file`：它是為了讓
# 「sidebar 列了沒翻的章節」在 pytest 先紅、而不是等 docusaurus build 掛掉才
# 發現，但它從來沒在 CI 執行過，那條路徑原封不動地留著。
name: Pytest

permissions:
  contents: read

on:
  pull_request:
    # 只管進 zh-tw-main 的 PR。english-main 放的是上游英文原文，語料狀態測試
    # 對它必紅（同 prettier.yml 的理由）。
    branches: [zh-tw-main]

concurrency:
  group: pytest-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      # 測試會 `git show english-main:<path>` 與 `git show HEAD:<path>`，
      # 需要完整歷史與 english-main 分支，淺 clone 會讓它們整批 skip。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch english-main
        run: git fetch origin english-main:english-main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # 與 translate-zh-tw.yml 同一組依賴。pytest 另外裝。
      - name: Install deps
        run: pip install commonmark pyyaml markdown-it-py opencc-python-reimplemented google-genai pytest

      - name: Run tests
        run: python -m pytest -q
