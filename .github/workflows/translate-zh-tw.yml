name: Translate docs to zh-TW

permissions:
  contents: write
  pull-requests: write

on:
  # 三個觸發源，缺一不可（前車之鑑：偵測失敗靜默五個月）：
  # - workflow_dispatch：upstream-sync 在 english-main 前進後顯式 dispatch
  #   （GITHUB_TOKEN 的 push 不會觸發下面的 push trigger —— GitHub 遞迴防護）。
  # - schedule：每日排水。BATCH_SIZE 限流下一次只翻一批，cron 保證殘量
  #   隔日繼續消化，不會像 backfill 前那樣無聲累積。無 stale 時秒退。
  # - push：人工推進 english-main 時即時觸發。
  schedule:
    - cron: "0 3 * * *" # upstream-sync 在 01:00 UTC 先跑
  push:
    branches: [english-main]
  workflow_dispatch:

env:
  BATCH_SIZE: "3" # free tier 每 model 20 req/天，每檔約 3-6 req；付費後可調回 10

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout zh-tw-main
        uses: actions/checkout@v4
        with:
          ref: zh-tw-main
          fetch-depth: 0
          # PAT（非 GITHUB_TOKEN）：Actions 被 repo 層 workflow permissions
          # 禁止建 PR，而該開關要 admin 才點得到（我們只有 maintain）。
          # PAT 不受那個開關管，故 push 與 gh pr create 一律走 PR_TOKEN。
          token: ${{ secrets.PR_TOKEN }}

      - name: Fetch english-main
        run: git fetch origin english-main

      # Setup MUST precede Detect. The old order ran --detect before pip install,
      # so the module import failed, 2>/dev/null || true swallowed it, COUNT became
      # 0, and the job went green while translating nothing for five months.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install commonmark pyyaml markdown-it-py opencc-python-reimplemented google-genai

      # prettier 是 frontmatter 格式的權威（見 scripts/zh_tw/frontmatter.py 的
      # _PrettierDumper docstring）：pyyaml 只做 best-effort，真正收斂在下面的
      # Format 步驟。python 端猜 prettier 的折行規則猜錯過一次，別再猜第二次。
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Detect files needing translation
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail   # a failing detect must turn the job red, not silently report 0
          # review F2：manifest 更新活在未合併的 auto PR branch 上，zh-tw-main
          # 的 detect 會對同一批檔重翻、PR 疊 PR（每日 cron 每天多一個 +
          # 重複燒 API）。有未合併的 auto PR 就本輪跳過（放在 detect 內部：
          # 若做成獨立 skipped step，後續 steps 讀到的 count 是空字串，
          # `!= '0'` 反而為真）。
          OPEN=$(gh pr list --state open --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("auto/zh-tw-"))] | length')
          if [ "$OPEN" != "0" ]; then
            echo "已有 $OPEN 個未合併的 auto PR，本輪跳過（merge 後下次 cron 續跑）。"
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python -m scripts.zh_tw --detect --english-ref origin/english-main \
            | head -n "$BATCH_SIZE" > /tmp/changed_files.txt
          COUNT=$(grep -c . /tmp/changed_files.txt || true)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Will translate $COUNT file(s):"
          cat /tmp/changed_files.txt

      - name: Skip if no changes
        if: steps.detect.outputs.count == '0'
        run: echo "No stale files, skipping."

      - name: Translate
        if: steps.detect.outputs.count != '0'
        id: translate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -uo pipefail
          # ⚠️ `set +e` 不可省略。GitHub 的預設 shell 是
          # `bash --noprofile --norc -eo pipefail {0}` —— **-e 本來就開著**，
          # 而 `set -uo pipefail` 只會「加」選項，關不掉它。少了這一行，
          # 底下自己判斷 rc 的整套容錯都是裝飾：xargs 一回非 0 就直接死在這裡。
          # 2026-09-03 run 33697227425 實證：`成功 2，失敗 1` → 步驟以 123 轉紅
          # → 後面全 skip → 那 2 個翻好的檔案整批丟掉。這個容錯從第一天就沒
          # 生效過，只是之前每次都剛好全部成功所以沒人發現。
          set +e
          # 部分失敗不中斷（前車之鑑：配額用盡 → xargs exit 123 → job 死在這裡
          # → 成功檔案從未 commit → 隔日重翻同一批 → 連續紅燈零進度）。
          # 成功檔案的 manifest 已落盤，後續照常 commit/PR；殘量隔日 cron 接手。
          # -d '\n' -r 與下面兩處 xargs 一致：含空白的路徑不被拆詞、空輸入不執行。
          # --result-jsonl：管線自報 ok/touched/failed。Commit step 直接讀這個
          # 數字判「本輪有沒有進展」，不從 git/檔案系統推論（見該 step 註解）。
          # 「result 檔存在 ⟹ 本輪自報過」這個前提整個押在這行上。
          # GitHub-hosted runner 是 ephemeral，但換 self-hosted／複用 /tmp 時，
          # 殘留檔若不可刪（權限、唯讀掛載）rm -f 會靜默成功退出，上一輪的
          # 成果就混進本輪加總。前提破掉要自己知道。
          rm -f /tmp/translate_result.jsonl || { echo "::error::無法清除舊 result 檔"; exit 1; }
          [ -e /tmp/translate_result.jsonl ] && { echo "::error::舊 result 檔仍在"; exit 1; }
          xargs -a /tmp/changed_files.txt -d '\n' -r \
            python -m scripts.zh_tw --backend gemini \
              --english-ref origin/english-main --apply \
              --result-jsonl /tmp/translate_result.jsonl
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          [ "$rc" -eq 0 ] || echo "::warning::部分檔案翻譯失敗（rc=$rc），先提交已成功者"

      # 必須在 Validate 之前：gate 檢查的要是最終落盤的內容，不是 prettier 改動前的。
      - name: Format with prettier
        if: steps.detect.outputs.count != '0'
        run: |
          set -euo pipefail
          # 餵給 prettier 的是「detect 清單 ∩ 本輪工作區真的變動的檔」。
          # 不是全 repo（會掃到 site/.docusaurus 建置產物與 pnpm-lock.yaml，
          # 195 檔不合規、全與翻譯無關），也不是整份 detect 清單，三個理由：
          #
          # 1. detect 列的是「該翻的」，翻譯步驟刻意容忍部分失敗（配額用盡）。
          #    失敗的新檔在磁碟上並不存在，直接餵給 prettier 會 ENOENT 轉紅，
          #    把「本輪其實翻成功了幾檔」整個蓋掉。
          # 2. 更關鍵：既有但本輪沒翻成的檔多半是舊版管線的產物、prettier 不合規
          #    （2026-09-01 語料 15 檔紅）。餵了它們就會生出純格式改動，而這份清單
          #    同時是 Commit step 判斷「本輪有沒有進展」的依據之一（見該 step 註解），
          #    髒進來會讓「本輪零翻譯成功」的紅燈不亮。
          # 3. 同一份清單給下面的 git add 用，順帶解掉 `git add <不存在的檔>`
          #    退 128 拖垮整批成功檔的老問題。
          #
          # 迴圈刻意用 if/fi 而非 `[ -f "$f" ] && printf`：後者在 while body 最後
          # 一圈為偽時，while 的回傳值是 1，`set -e` 下是否中止取決於 bash 版本。
          # if 沒有 else 分支時一律回 0，不留這個問題。
          : > /tmp/format_files.txt
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            # git status 的 rc 要自己檢查：它包在 `[ -n "$(...)" ]` 裡時，
            # 非零退出不會被 set -e 攔下，失敗會被讀成「這檔沒變」→ 該檔
            # 既不格式化也不 git add → 翻譯成果靜默丟棄而 job 還是綠的。
            if ! status=$(git status --porcelain -- "$f"); then
              echo "::error::git status 對 $f 失敗"; exit 1
            fi
            # -f 與「有變更」兩個條件都要：已刪除的追蹤檔在 porcelain 是
            # ` D path`（非空）卻不在磁碟上，只看 git 狀態會餵給 prettier
            # 吃 ENOENT。目前 pipeline 沒有刪檔路徑，但不把正確性押在
            # 一個外部不變式上。
            if [ -f "$f" ] && [ -n "$status" ]; then
              printf '%s\n' "$f" >> /tmp/format_files.txt
            fi
          done < /tmp/changed_files.txt
          if [ -s /tmp/format_files.txt ]; then
            # 版本釘死：浮動的 prettier@3 一旦 minor 改變輸出，這裡 --write 的版本
            # 與 prettier.yml gate --check 的版本會在不同時間各自解析，可能一個 3.9
            # 一個 3.10 → 剛格式化過的 PR 被自己的 gate 擋下。三處版本字串由
            # tests/test_prettier_version.py 守住，不靠人工同步。
            # -d '\n' 讓含空白的路徑不被拆詞（GNU xargs；runner 是 ubuntu）。
            xargs -a /tmp/format_files.txt -d '\n' -r npx --yes prettier@3.9.6 --write --
          else
            echo "本輪工作區零變動，跳過格式化。"
          fi

      - name: Validate before commit
        if: steps.detect.outputs.count != '0'
        run: |
          set -euo pipefail
          python -m scripts.zh_tw.check_repo

      - name: Commit and push
        if: steps.detect.outputs.count != '0'
        run: |
          set -euo pipefail
          # 「本輪有沒有進展」直接讀管線自報的 ok 數，不從 git/檔案系統推論。
          #
          # 這個判定連續三輪 review 各出一個 blocker，全部同源 —— 拿代理量當
          # 真實性質（lessons L2），且三次的失效形式都是「job 全綠但管線靜默停擺」：
          #   輪一 `git diff --cached` 非空 → prettier 對「既有但本輪沒翻成」的
          #        舊管線產物做純格式改動，零翻譯成功也能撐起假 diff。
          #   輪二 同上 → `_save_manifest_updates`（pipeline.py）在 apply 下無條件
          #        save，touched 為空也照寫，manifest 的正規化噪音是第二條旁路。
          #   輪三 「工作區有檔案變動」→ 反方向漏掉 tier A 產出 byte-identical 的
          #        情形：工作區零 diff，但 manifest 的 provenance 更新是唯一真實
          #        成果，早退丟掉它 → 該檔永遠 stale、每天重翻、佔死 BATCH_SIZE。
          # 原始量從頭到尾是 run() 手上的 ok 與 touched，manifest 與工作區 diff
          # 都只是它們的影子。現在直接讀本體，整段推論刪掉。
          #
          # 檔案不存在 = 管線沒跑或壞了，不能猜成 0（那會靜默丟掉成果），轉紅。
          if [ ! -f /tmp/translate_result.jsonl ]; then
            echo "::error::找不到 /tmp/translate_result.jsonl，翻譯步驟沒有自報成果"
            exit 1
          fi
          # 加總 touched 而不是 ok：ok 是「產出了幾份譯文字串」，`ok += 1` 在
          # pipeline.py 的 `if apply:` 之外，dry-run 也會累加；touched 只在寫檔
          # 之後才 add，才是「落盤了幾檔」。兩者在 --apply 下相等，但那是外部
          # 不變式 —— 日後誰加一個不帶 --apply 的冒煙步驟，讀 ok 就會判成
          # 「有進展」而 index 是空的，git commit 以 nothing to commit 轉紅。
          APPLIED=$(python - /tmp/translate_result.jsonl <<'PY'
          import json, sys

          total = 0
          with open(sys.argv[1], encoding="utf-8") as fh:
              for line in fh:
                  line = line.strip()
                  if line:
                      total += len(json.loads(line)["touched"])
          print(total)
          PY
          )
          echo "本輪落盤 $APPLIED 檔。"
          if [ "$APPLIED" = "0" ]; then
            # 部分成功走 PR 流程、失敗殘量由 cron 續跑；全數失敗才轉紅。
            [ "${{ steps.translate.outputs.rc }}" = "0" ] || { echo "::error::本輪零成功"; exit 1; }
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="auto/zh-tw-${{ github.run_id }}"
          # checkout -b 在 HEAD 建分支，不動 index/工作區/untracked，
          # 上面算好的 format_files.txt 不會失效。
          git checkout -b "$BRANCH"
          # ok>0 才 add manifest：ok=0 時上面已經早退，這裡不會 stage 到
          # `_save_manifest_updates` 的純正規化寫入。
          git add scripts/translation-manifest.json
          # 用 Format step 算好的「真的變動了」清單，不用整份 detect 清單：
          # detect 會列出上游新增、本地尚不存在的檔，翻譯若因配額失敗，
          # `git add -- book/新檔.md` 會以 pathspec did not match 退 128，
          # set -e 下拖垮同批其他已翻成功的檔。
          # -r：清單可能是空的（只有 manifest provenance 變動的情形），
          #     空輸入不要跑 git add。
          xargs -a /tmp/format_files.txt -d '\n' -r git add --
          git commit -m "Auto update zh-TW translations (Gemini)"
          git push origin "$BRANCH"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"

      - name: Open PR into zh-tw-main
        if: steps.detect.outputs.count != '0' && env.BRANCH != ''
        env:
          GH_TOKEN: ${{ secrets.PR_TOKEN }}
        run: |
          # 開 PR 失敗不轉紅：翻譯與 push 都已成功，只差最後這一步（token 過期、
          # 配額、API 抽風）。降級成 warning + 可點的 compare 連結，人工補開即可，
          # 避免整條 job 紅燈掩蓋掉「本輪其實翻成功了」。
          gh pr create --base zh-tw-main --head "$BRANCH" \
            --title "Update zh-TW translations (Gemini)" \
            --body "自動翻譯 english-main 上變動的 Markdown 檔案。已通過 check_repo。請檢查術語與翻譯品質後再合併。" \
            || {
              echo "::warning::gh pr create 失敗，請手動開 PR：https://github.com/${{ github.repository }}/compare/zh-tw-main...$BRANCH?expand=1"
              exit 0
            }
