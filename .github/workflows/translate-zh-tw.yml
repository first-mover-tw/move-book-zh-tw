name: Translate docs to zh-TW

permissions:
  contents: write

on:
  push:
    branches:
      - english-main
  workflow_dispatch:

jobs:
  translate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-generativeai

      - name: List markdown files (debug)
        id: files
        run: |
          set -e
          FILES=$(find book reference -name "*.md" -print || true)
          echo "Found files:"
          echo "$FILES"
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Stop if no markdown files
        if: steps.files.outputs.files == ''
        run: echo "No markdown files found under book/ or reference/."

      - name: Translate markdown files to zh-TW (Gemini)
        if: steps.files.outputs.files != ''
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "Translating files:"
          echo "${{ steps.files.outputs.files }}"
          python scripts/translate_to_zh_tw.py ${{ steps.files.outputs.files }}

      - name: Show git status (debug)
        run: |
          git status
          ls -R book || true
          ls -R reference || true

      - name: Commit to auto branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -B auto/zh-tw-update
          git add book/**/*.zh-TW.md reference/**/*.zh-TW.md || echo "no zh-TW files"
          git status
          git commit -m "Auto update zh-TW translations (Gemini)" || echo "No changes to commit"
          git push -f origin auto/zh-tw-update || echo "No changes to push"

      - name: Open PR into zh-tw-main
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: zh-tw-main
          head: auto/zh-tw-update
          title: "Update zh-TW translations (Gemini)"
          body: |
            使用 Gemini API 將 book/ 與 reference/ 的 Markdown 翻譯為繁體中文（臺灣用語）。
            請檢查術語與翻譯品質後再合併。
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-generativeai
