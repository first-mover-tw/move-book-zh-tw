name: Translate docs to zh-TW

permissions:
  contents: write

on:
  push:
    branches:
      - english-main       # 只要英文分支有更新就觸發
  workflow_dispatch:

jobs:
  translate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all branches
        run: |
          git fetch --all --prune
          git branch -r

      - name: List markdown files (debug)
        run: |
          echo "Markdown files under book/:"
          find book -name "*.md" -print || echo "no book md"
          echo "Markdown files under reference/:"
          find reference -name "*.md" -print || echo "no reference md"

      - name: OpenAI continuous translation
        uses: yunwei37/OpenAI-Continuous-Translator@master
        with:
          git_repo_url: https://github.com/${{ github.repository }}
          api_key: ${{ secrets.OPENAI_API_KEY }}
          source_language: English
          target_language: Traditional Chinese
          file_path_filter: "book/**/*.md,reference/**/*.md"
          i18n_surfix: ".zh-TW"
          additional_prompt: |
            Translate to Traditional Chinese (Taiwan).
            Keep markdown structure and code blocks unchanged.

      - name: Commit to auto branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -B auto/zh-tw-update
          git add book/**/*.zh-TW.md reference/**/*.zh-TW.md || echo "no zh-TW files"
          git status
          git commit -m "Auto update zh-TW translations" || echo "No changes to commit"
          git push -f origin auto/zh-tw-update || echo "No changes to push"

      - name: Open PR into zh-tw-main
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: zh-tw-main
          head: auto/zh-tw-update
          title: "Update zh-TW translations from upstream (full)"
          body: |
            初次完整翻譯 book/ 與 reference/ 下的 Markdown。
            之後可以再調整為只翻譯 diff 的檔案。
