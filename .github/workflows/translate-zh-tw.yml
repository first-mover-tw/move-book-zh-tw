name: Translate docs to zh-TW

permissions:
  contents: write
  pull-requests: write

on:
  push:
    branches:
      - english-main
  schedule:
    - cron: "0 2 * * *"  # Daily at 02:00 UTC
  workflow_dispatch:

jobs:
  translate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout zh-tw-main
        uses: actions/checkout@v4
        with:
          ref: zh-tw-main
          fetch-depth: 0

      - name: Fetch english-main
        run: git fetch origin english-main

      - name: Detect files needing translation
        id: detect
        run: |
          CHANGED=$(python scripts/translate_to_zh_tw.py --detect --english-ref origin/english-main 2>/dev/null || true)
          echo "Changed files:"
          echo "$CHANGED"
          COUNT=$(echo "$CHANGED" | grep -c . || true)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "$CHANGED" > /tmp/changed_files.txt

      - name: Checkout english source files
        if: steps.detect.outputs.count != '0'
        run: |
          # Only checkout the files we will actually translate (first 5)
          head -5 /tmp/changed_files.txt | while IFS= read -r file; do
            [ -z "$file" ] && continue
            git checkout origin/english-main -- "$file" 2>/dev/null || true
          done

      - name: Skip if no changes
        if: steps.detect.outputs.count == '0'
        run: echo "No changed .md files, skipping translation."

      - name: Setup Python
        if: steps.detect.outputs.count != '0'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.detect.outputs.count != '0'
        run: pip install google-genai

      - name: Translate changed files
        if: steps.detect.outputs.count != '0'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          cat /tmp/changed_files.txt | head -5 | xargs python scripts/translate_to_zh_tw.py --batch-size 5 --sleep 20

      - name: Commit and push
        if: steps.detect.outputs.count != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B auto/zh-tw-update
          git add scripts/translation-manifest.json
          git add $(cat /tmp/changed_files.txt | head -5)
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Auto update zh-TW translations (Gemini)"
          git push -f origin auto/zh-tw-update

      - name: Open PR into zh-tw-main
        if: steps.detect.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base zh-tw-main \
            --head auto/zh-tw-update \
            --title "Update zh-TW translations (Gemini)" \
            --body "自動翻譯 english-main 上變動的 Markdown 檔案為繁體中文。請檢查術語與翻譯品質後再合併。" \
            || echo "PR already exists or no changes"
