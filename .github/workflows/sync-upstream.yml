name: Sync upstream English

permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *"   # 每天一次，可依需求調整
  workflow_dispatch:

jobs:
  sync_with_upstream:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: english-main
          fetch-depth: 0

      - name: Sync from MystenLabs/move-book
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4
        with:
          target_sync_branch: english-main
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}

          upstream_sync_repo: MystenLabs/move-book
          upstream_sync_branch: main

          # 允許合併無共同祖先的歷史（fork 重建或 shallow clone 導致）
          upstream_pull_args: "--tags --allow-unrelated-histories"
          test_mode: true
