name: Sync upstream English

permissions:
  contents: write
  pull-requests: write

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  sync_with_upstream:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: english-main
          fetch-depth: 0

      - name: Sync from MystenLabs/move-book
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/MystenLabs/move-book.git || true
          git fetch upstream main --tags

          # Check if there are new commits
          LOCAL=$(git rev-parse HEAD)
          UPSTREAM=$(git rev-parse upstream/main)
          MERGE_BASE=$(git merge-base HEAD upstream/main 2>/dev/null || echo "none")

          if [ "$MERGE_BASE" = "$UPSTREAM" ]; then
            echo "Already up to date."
            exit 0
          fi

          # Try to merge
          if git merge upstream/main --no-edit --allow-unrelated-histories; then
            echo "Merge succeeded, pushing..."
            git push origin english-main
          else
            echo "Merge conflict detected, creating PR..."
            git merge --abort

            # Create a temp branch from upstream
            BRANCH="auto-sync/upstream-$(date +%Y%m%d-%H%M%S)"
            git checkout -b "$BRANCH" upstream/main
            git push origin "$BRANCH"

            gh pr create \
              --base english-main \
              --head "$BRANCH" \
              --title "chore: sync upstream (conflict needs manual resolve)" \
              --body "$(cat <<'EOF'
          Automatic merge from `MystenLabs/move-book:main` failed due to conflicts.

          Please resolve manually and merge this PR.
          EOF
              )"
          fi
